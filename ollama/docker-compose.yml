services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-qwen3.5-2b
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11438:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL}
      - OLLAMA_CONTEXT_LENGTH=4096
      - OLLAMA_GPU_MEMORY_FRACTION=0.85
    runtime: nvidia
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        echo 'Starting Ollama...';
        ollama serve &
        sleep 15

        echo 'Pulling qwen3.5:2b...';
        ollama pull qwen3.5:2b

        echo 'Ready.';
        wait
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 40s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: on-failure
volumes:
  ollama_data: